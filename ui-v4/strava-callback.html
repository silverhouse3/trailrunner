<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrailRunner — Strava Connected</title>
<style>
  body { background: #090b10; color: #e0e6f0; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: #12151e; border: 1px solid #1e2a3a; border-radius: 12px; padding: 40px; text-align: center; max-width: 400px; }
  h1 { color: #fc4c02; font-size: 24px; margin: 0 0 8px; }
  p { color: #8094ab; font-size: 14px; line-height: 1.6; }
  .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #1e2a3a; border-top-color: #fc4c02; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 16px 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success { color: #22c55e; font-size: 18px; font-weight: 600; }
  .error { color: #ef4444; font-size: 14px; }
  .done { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>TRAILRUNNER</h1>

  <div id="loading">
    <div class="spinner"></div>
    <p>Connecting to Strava...</p>
  </div>

  <div id="success" class="done">
    <p class="success">Connected!</p>
    <p>TrailRunner can now read your Strava runs. After each run it asks before saving to Strava.<br>You can close this page.</p>
    <p class="error" id="scopeNote" style="font-size:13px"></p>
    <p style="font-size:12px;color:#4a5568">Redirecting back to TrailRunner...</p>
  </div>

  <div id="error" class="done">
    <p class="error" id="errorMsg">Something went wrong.</p>
    <p>Try connecting again from TrailRunner Settings.</p>
  </div>
</div>

<script src="js/strava-config.js"></script>
<script>
(async function() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const err = params.get('error');
  const state = params.get('state');
  const grantedScope = params.get('scope') || '';

  function fail(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('errorMsg').textContent = msg;
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  if (err || !code) { fail(err || 'No authorization code received.'); return; }

  // CSRF check: the state the app generated (StravaApi.authorizeUrl) must come back unchanged.
  // Legacy flow (older app builds) stored no state: accept only when none was stored.
  const expected = lsGet('tr_strava_oauth_state');
  if (expected && state !== expected) { fail('Security check failed (state mismatch). Start the connection again from TrailRunner Settings.'); return; }
  try { localStorage.removeItem('tr_strava_oauth_state'); } catch (e) {}

  // Get stored app credentials + optional secret-less token proxy
  let app = null, prefs = {};
  try { app = JSON.parse(lsGet('tr_strava_app')); } catch (e) {}
  if ((!app || !app.clientId) && window.TR_STRAVA_CONFIG && window.TR_STRAVA_CONFIG.clientId) {
    app = { clientId: String(window.TR_STRAVA_CONFIG.clientId), clientSecret: (app && app.clientSecret) || '' };
  }
  try { prefs = JSON.parse(lsGet('tr_strava_prefs')) || {}; } catch (e) {}
  const proxy = (prefs.tokenProxyUrl || '').trim();

  if (!app || !app.clientId || (!app.clientSecret && !proxy)) {
    fail('Strava credentials not found. Open TrailRunner Settings first.');
    return;
  }

  // Local mock (tests only): TrailRunner remembers ?strava=host:port for this tab; loopback / private LAN hosts only.
  let tokenUrl = proxy || 'https://www.strava.com/oauth/token';
  try {
    const mh = sessionStorage.getItem('tr_strava_host') || '';
    const h = mh.split(':')[0];
    if (mh && (h === 'localhost' || h === '127.0.0.1' || /^10\./.test(h) || /^192\.168\./.test(h) || /^172\.(1[6-9]|2\d|3[01])\./.test(h) || /\.local$/.test(h))) {
      tokenUrl = 'http://' + mh + '/oauth/token';
    }
  } catch (e) {}

  // Exchange code for tokens (the secret is only sent when there is no proxy)
  try {
    const body = { client_id: app.clientId, code: code, grant_type: 'authorization_code' };
    if (!proxy && app.clientSecret) body.client_secret = app.clientSecret;
    const resp = await fetch(tokenUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!resp.ok) {
      throw new Error('Token exchange failed: ' + resp.status);
    }

    const data = await resp.json();

    // Store tokens + the scope Strava actually granted (she can untick boxes on the consent screen)
    const scope = grantedScope || data.scope || lsGet('tr_strava_scope_requested') || '';
    localStorage.setItem('tr_strava', JSON.stringify({
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: data.expires_at,
      scope: scope,
      athlete: data.athlete ? {
        id: data.athlete.id,
        firstname: data.athlete.firstname,
        lastname: data.athlete.lastname,
      } : null,
    }));

    document.getElementById('loading').style.display = 'none';
    document.getElementById('success').style.display = 'block';
    if (scope && (scope.indexOf('activity:write') < 0 || scope.indexOf('activity:read_all') < 0)) {
      document.getElementById('scopeNote').textContent = 'Some permissions were not granted (' + scope + '). Reconnect and tick all boxes to read your runs and upload.';
    }

    // Redirect back to TrailRunner after 2 seconds
    setTimeout(() => {
      window.location.href = './index.html';
    }, 2000);

  } catch (e) {
    fail(e.message);
  }
})();
</script>
</body>
</html>
